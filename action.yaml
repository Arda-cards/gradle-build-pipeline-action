---
name: gradle-build-pipeline
description: "Checkout, build and tag gradle projects"
inputs:
  feature_marker:
    description: >-
      The feature-build marker for this ref, used when `derive_feature_marker` is
      `false`; empty is valid and means an ordinary build. Passed to qualify-build-action.
    required: false
    default: ""
  derive_feature_marker:
    description: >-
      Whether qualify-build-action reads the marker from `changelog_dir` instead of
      taking it from `feature_marker`. Must be `false` when `feature_marker` is non-empty.
    required: false
    default: "true"
  changelog_dir:
    description: "Directory holding per-pull-request changelog files; passed to qualify-build-action."
    required: false
    default: .changelog
  codecov_token:
    description: "The token to upload coverage to Codecov"
    required: false
    default: ""
  docker_registry:
    description: "The registry to persist Docker images"
    required: true
  gpr_user:
    description: "Name of a user with read access to packages, required to get dependencies"
    required: true
  gpr_key:
    description: "Personal Access Token of the gpr_user with read access to packages, required to get dependencies"
    required: true
  helm_registry:
    description: "The registry to persist Helm charts"
    required: true
  skip_test:
    description: "Skip test execution (true|false)"
    required: false
    default: "false"
  token:
    description: "The workflow's GitHub token"
    required: true
  validate_against_base:
    description: >-
      Whether a pull request must introduce exactly one new changelog version.
      Set false where the changelog is composed after merge; passed to qualify-build-action.
    required: false
    default: "true"
outputs:
  chart_name:
    description: "The name of the helm chart, if published"
    value: ${{ steps.build.outputs.chart_name }}
  chart_version:
    description: "The version of the helm chart, if published"
    value: ${{ steps.build.outputs.chart_version }}
  module_name:
    description: "The name of the module"
    value: ${{ steps.read-module-info.outputs.name }}
  kind:
    description: >-
      Whether this build published artifacts (`publish`) or was a test (`test`). Lets a
      caller gate on the build's own classification rather than infer it from whether an
      artifact name came back. Note that a feature build also reports `publish`; use the
      event and ref to tell a release from a feature build.
    value: ${{ steps.qualify-build.outputs.kind }}
runs:
  using: "composite"
  steps:
    - name: "Configure git client"
      shell: bash
      run: |
        [ "${{ runner.debug }}" == 1 ] && set -xv
        set -u
        
        git config user.name "${{ github.actor }}"
        git config user.email "${{ github.actor }}@users.noreply.github.com"
    - name: "Setup gradle toolchain"
      uses: Arda-cards/gradle-toolchain-action@v1
      with:
        token: ${{ inputs.token }}
    - id: read-module-info
      name: "Read module information"
      shell: bash
      run: |
        [ "${{ runner.debug }}" == 1 ] && set -xv
        set -u

        name="$(./gradlew -q properties | grep ^name: | cut -d: -f 2 | tr -d ' ')"
        echo "::notice::name is ${name}"
        echo "name=${name}" >>"${GITHUB_OUTPUT}"
    - uses: Arda-cards/qualify-build-action@v2
      id: qualify-build
      with:
        feature_marker: ${{ inputs.feature_marker }}
        derive_feature_marker: ${{ inputs.derive_feature_marker }}
        changelog_dir: ${{ inputs.changelog_dir }}
        validate_against_base: ${{ inputs.validate_against_base }}
        workflow_name: "context:build"
    - name: "Tag source"
      shell: bash
      run: |
        [ "${{ runner.debug }}" == 1 ] && set -xv
        set -u
        
        readonly tag="${{ steps.qualify-build.outputs.tag }}"
        if [ "${{ steps.qualify-build.outputs.trigger }}" == "push_to_release_branch" ]; then
          if [ "${{ steps.qualify-build.outputs.kind }}" == "publish" ]; then
            echo "::notice::Tagging ${tag}"
            readonly workflow_run="${{ github.run_id }}.${{ github.run_number }}.${{ github.run_attempt }}"
            git tag -m "Released by ${{ github.job }}, ${workflow_run}" -a "${tag}"
            git push origin "${tag}"
          fi
        elif [ "${{ steps.qualify-build.outputs.target}}" == "release" ]; then
          echo "::notice::Looking for existing ${tag}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::tag $tag exists already"
            exit 1
          fi
        fi
    - id: build
      name: "Build, test and publish"
      shell: bash
      run: ${{ github.action_path }}/gradle-build.sh
      env:
        DOCKER_REGISTRY: ${{ inputs.docker_registry }}
        GPR_USER: ${{ inputs.gpr_user }}
        GPR_KEY: ${{ inputs.gpr_key }}
        HELM_REGISTRY: ${{ inputs.helm_registry }}
        KIND: ${{ steps.qualify-build.outputs.kind }}
        SKIP_TEST: ${{ inputs.skip_test }}
        TOKEN: ${{ inputs.token }}
        VERSION: ${{ steps.qualify-build.outputs.version }}
    - id: clq-extract
      if: steps.qualify-build.outputs.trigger == 'push_to_release_branch'
      name: "Extract tag from the changelog"
      uses: denisa/clq-action@v1
      with:
        changeMap: .github/clq/changemap.json
        mode: ${{ steps.qualify-build.outputs.target }}
    - uses: ncipollo/release-action@v1
      if: steps.qualify-build.outputs.trigger == 'push_to_release_branch'
      with:
        tag: ${{ steps.qualify-build.outputs.tag }}
        prerelease: ${{ steps.clq-extract.outputs.status == 'prereleased' }}
        name: ${{ steps.clq-extract.outputs.name }}
        body: ${{ steps.clq-extract.outputs.changes }}
    - name: "Remove tag of failed build"
      if: failure() && steps.build.outcome == 'failure'
      shell: bash
      run: |
        [ "${{ runner.debug }}" == 1 ] && set -xv
        set -u
        
        if [ "${{ steps.qualify-build.outputs.kind }}" == "publish" ] \
            && [ "${{ steps.qualify-build.outputs.trigger }}" == "push_to_release_branch" ] ; then
          readonly tag="${{ steps.qualify-build.outputs.tag }}"
          echo "::notice::Removing tag ${tag}"
          git push --delete origin "${tag}"
        fi
    - name: Store reports
      if: failure() && steps.build.outcome == 'failure'
      uses: actions/upload-artifact@v7
      with:
        name: reports
        if-no-files-found: ignore
        overwrite: true
        path: |
          **/build/reports/
          **/build/test-results/
    - name: "Upload coverage to Codecov"
      if: always() && inputs.codecov_token != '' && hashFiles('build/reports/kover/report.xml') != ''
      continue-on-error: true
      uses: codecov/codecov-action@v7
      with:
        token: ${{ inputs.codecov_token }}
        files: build/reports/kover/report.xml
        fail_ci_if_error: false
